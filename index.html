<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef0f3" />
    <title>案头 · 每日工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231f4e79'/%3E%3Cpath d='M8 17.2 13 22 24 10' fill='none' stroke='%23ffffff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sheet">
      <header class="mast">
        <div class="mast-brand">
          <p class="eyebrow">案头</p>
          <p class="brand-note">每日待办</p>
        </div>
        <button type="button" class="today-link" data-action="today" hidden>回到今天</button>
      </header>

      <section class="date-block" aria-label="日期">
        <div class="date-nav">
          <div class="date-readout">
            <p class="date-kicker" id="date-kicker"></p>
            <h1 class="date-num" id="date-num"></h1>
            <p class="date-sub" id="date-sub"></p>
          </div>
          <div class="date-controls">
            <button type="button" class="icon-btn" data-action="prev-day" aria-label="前一天">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
            </button>
            <button type="button" class="icon-btn" data-action="next-day" aria-label="后一天">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
            </button>
          </div>
        </div>
        <div class="week" id="week" role="tablist" aria-label="本周"></div>
      </section>

      <section class="todos" aria-label="待办">
        <div class="todos-head">
          <h2>待办</h2>
          <div class="filters" id="filters" role="tablist" aria-label="按类型查看">
            <button type="button" data-action="filter" data-kind="all" aria-selected="true">全部</button>
            <button type="button" data-action="filter" data-kind="work" aria-selected="false">工作</button>
            <button type="button" data-action="filter" data-kind="life" aria-selected="false">生活</button>
            <button type="button" data-action="filter" data-kind="growth" aria-selected="false">成长</button>
            <button type="button" data-action="filter" data-kind="other" aria-selected="false">其他</button>
          </div>
        </div>

        <form class="composer" id="composer">
          <input id="draft" type="text" maxlength="120" placeholder="添加待办，回车确认" autocomplete="off" />
          <label class="due-field" id="due-field">
            截止
            <svg class="due-icon" viewBox="0 0 20 20" aria-hidden="true">
              <rect x="3" y="4.5" width="14" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 8h14M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span id="due-display" hidden></span>
            <input id="due" type="hidden" />
          </label>
          <button type="submit">添加</button>
        </form>

        <div id="carry" class="carry" hidden></div>
        <ul class="list" id="open-list"></ul>
        <div id="done-wrap" hidden>
          <button type="button" class="done-toggle" data-action="toggle-done" aria-expanded="false">
            <span id="done-label">已完成</span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" /></svg>
          </button>
          <ul class="list done-list" id="done-list" hidden></ul>
        </div>
        <p class="empty" id="empty" hidden>这一天还没有待办。</p>
      </section>

      <section class="side-block" aria-label="灵感一刻">
        <button type="button" class="side-toggle" data-action="toggle-ideas" aria-expanded="false">
          <span>灵感一刻</span>
          <span class="side-count" id="ideas-count" hidden></span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" /></svg>
        </button>
        <div class="side-body" id="ideas-body" hidden>
          <form class="idea-form" id="idea-form">
            <input id="idea-input" type="text" maxlength="120" placeholder="记一个点子，回车确认" autocomplete="off" />
            <button type="submit">记下</button>
          </form>
          <ul class="idea-list" id="idea-list"></ul>
        </div>
      </section>

      <section class="side-block" aria-label="笔记本">
        <button type="button" class="side-toggle" data-action="toggle-notebook" aria-expanded="false">
          <span>笔记本</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" /></svg>
        </button>
        <div class="side-body" id="notebook-body" hidden>
          <textarea id="notebook" rows="4" maxlength="20000" placeholder="随手记，自动保存"></textarea>
        </div>
      </section>

      <footer class="colophon">
        <span id="count-line"></span>
      </footer>
    </div>

    <!-- 自定义日历弹窗 -->
    <div class="calendar-pop" id="calendar-pop" hidden>
      <div class="cal-header">
        <button type="button" class="cal-nav" data-cal-action="prev" aria-label="上个月">
          <svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
        </button>
        <span class="cal-title" id="cal-title"></span>
        <button type="button" class="cal-nav" data-cal-action="next" aria-label="下个月">
          <svg viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
        </button>
      </div>
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-footer">
        <button type="button" class="cal-clear" data-cal-action="clear">清除</button>
        <button type="button" class="cal-today" data-cal-action="today">今天</button>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
